<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Data Labeling Platform</title>
    <link rel="stylesheet" href="/static/visual.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-editorial">
            <div class="auth-mark">AI Data Labeling / Workspace</div>
            <h1>Ham veriden<br>anlama.</h1>
            <p class="auth-caption">Cümle, kelime, görsel, NER ve object detection projeleri için sakin ve teknik bir annotation çalışma alanı.</p>
        </section>
        <section class="auth-form-pane">
            <div class="auth-form">
                <div class="eyebrow">Platform / Start</div>
                <h2 class="auth-title">Çalışma alanını aç.</h2>
                <p class="auth-copy">Mevcut projelerinize devam edin veya yeni bir labeling sistemi kurun.</p>
                <div style="display:flex; flex-direction:column; gap:10px;"><a href="/login" class="btn btn-primary btn-block">Giriş Yap →</a><a href="/register" class="btn btn-secondary btn-block">Yeni Hesap Oluştur</a></div>
            </div>
        </section>
    </main>
</body>
</html>
