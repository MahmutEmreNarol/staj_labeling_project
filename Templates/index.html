<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu Raporu</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #9ace6a 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .weather-card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            text-align: center;
            width: 280px;
        }
        .city {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .temp {
            font-size: 48px;
            font-weight: bold;
            color: #ff6b6b;
            margin: 15px 0;
        }
        .desc {
            font-size: 18px;
            color: #777;
        }
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <div class="city">Konya</div>
        <div class="temp">28°C</div>
        <div class="desc">Güneşli & Açık</div>
        <a href="/" class="btn-home">Ana Sayfaya Dön</a>
    </div>

</body>
</html>
